<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Droguería</title>

  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container py-5">

    <h1 class="text-center mb-4">
      Sistema de Droguería
    </h1>

    <!-- Formulario -->
    <div class="card shadow mb-5">
      <div class="card-body">

        <h3 class="mb-4">Agregar Medicamento</h3>

        <form id="productoForm">

          <div class="row g-3">

            <div class="col-md-6">
              <input
                type="text"
                id="nombre"
                class="form-control"
                placeholder="Nombre"
                required
              >
            </div>

            <div class="col-md-6">
              <input
                type="text"
                id="categoria"
                class="form-control"
                placeholder="Categoría"
                required
              >
            </div>

            <div class="col-12">
              <textarea
                id="descripcion"
                class="form-control"
                placeholder="Descripción"
              ></textarea>
            </div>

            <div class="col-md-6">
              <input
                type="number"
                id="precio"
                class="form-control"
                placeholder="Precio"
                required
              >
            </div>

            <div class="col-md-6">
              <input
                type="number"
                id="stock"
                class="form-control"
                placeholder="Stock"
                required
              >
            </div>

          </div>

          <button class="btn btn-primary mt-4 w-100">
            Guardar Producto
          </button>

        </form>

      </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow">
      <div class="card-body">

        <h3 class="mb-4">Inventario</h3>

        <div class="table-responsive">

          <table class="table table-hover align-middle">

            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Categoría</th>
              </tr>
            </thead>

            <tbody id="tablaProductos"></tbody>

          </table>

        </div>

      </div>
    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
