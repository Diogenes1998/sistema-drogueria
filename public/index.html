<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Droguería</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container py-5">

  <!-- TITULO -->
  <div class="hero text-center mb-5">

    <img
      src="imagen/logo.png"
      class="hero-img"
    >

    <h1>Sistema de Droguería</h1>

    <p>
      Gestión moderna de medicamentos
    </p>

  </div>

  <!-- FORMULARIO -->
  <div class="card shadow mb-5">

    <div class="card-body">

      <h3 class="mb-4">

        <i class="bi bi-plus-circle"></i>

        Agregar Medicamento

      </h3>

      <form id="productoForm">

        <div class="row g-3">

          <div class="col-md-6">

            <input
              type="text"
              id="nombre"
              class="form-control"
              placeholder="Nombre"
              required
            >

          </div>

          <div class="col-md-6">

            <input
              type="text"
              id="forma"
              class="form-control"
              placeholder="Forma"
            >

          </div>

          <div class="col-md-6">

            <input
              type="text"
              id="laboratorio"
              class="form-control"
              placeholder="Laboratorio"
            >

          </div>

          <div class="col-md-6">

            <input
              type="text"
              id="invima"
              class="form-control"
              placeholder="INVIMA"
            >

          </div>

          <div class="col-md-6">

            <input
              type="text"
              id="lote"
              class="form-control"
              placeholder="Lote"
            >

          </div>

          <div class="col-md-6">

            <input
              type="text"
              id="vence"
              class="form-control"
              placeholder="Fecha de vencimiento (dd/mm/aaaa)"
              maxlength="10"
              oninput="formatearFecha(this)"
            >

          </div>

          <div class="col-12">

            <textarea
              id="descripcion"
              class="form-control"
              placeholder="Descripción"
            ></textarea>

          </div>

          <div class="col-md-12">

            <input
              type="text"
              id="categoria"
              class="form-control"
              placeholder="Categoría"
            >

          </div>

          <div class="col-md-6">

            <input
              type="number"
              id="precio"
              class="form-control"
              placeholder="Precio"
              min="0"
              required
            >

          </div>

          <div class="col-md-6">

            <input
              type="number"
              id="stock"
              class="form-control"
              placeholder="Cantidad"
              min="0"
              required
            >

          </div>

          <div class="col-md-12">

            <input
              type="text"
              id="precioUnitario"
              class="form-control"
              placeholder="Precio Unitario"
              readonly
            >

          </div>

        </div>

        <button class="btn btn-primary mt-4 w-100">

          <i class="bi bi-save"></i>

          Guardar Producto

        </button>

      </form>

    </div>

  </div>

  <!-- TABLA -->

  <div class="card shadow">

    <div class="card-body">

      <h3 class="mb-4">

        <i class="bi bi-table"></i>

        Inventario

      </h3>

      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-dark">

            <tr>

              <th>Nombre</th>
              <th>Forma</th>
              <th>Laboratorio</th>
              <th>INVIMA</th>
              <th>Lote</th>
              <th>Fecha Vencimiento</th>
              <th>Precio</th>
              <th>Cantidad</th>
              <th>Precio Unitario</th>

            </tr>

          </thead>

          <tbody id="tablaProductos"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script src="app.js"></script>

</body>
</html>
